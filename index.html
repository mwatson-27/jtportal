ns and goals. 				1.	Strategic (long term): Planning for the following 3-5 years 		- Assists in determining where in the market the business wants to be and what the business wants to achieve in relation to its competitors 		2.	Tactical (medium term): Planning for the next 1-2 years 		-	Assists in implementing strategic planning and allows the business to respond quickly to change; planning flexible/adaptable with emphasis on goals and allocation of resources 		3.	Operations (short term): Weekly/daily planning		-	Provides specific detail about the way the business will operate in the short term		Organising		 	Organising the financial, human and material resources to achieve the goals of the business. 		Managers must put into practice goals determined at the planning stage.				1.	Determining the work activities: Breaking down tasks into smaller more achievable steps 		2.	Classifying/grouping activities: Similar activities are grouped together to improve efficiency and enable the most appropriate allocation of resources 		3.	Assigning work and delegating authority: Determining who will carry out the work and who is responsible to ensure the work is carried out. 				Controlling 			Compares what was intended to happen with what has actually happened.		-	Establishes standards in line with the goals of the business, measuring performance of the business against these benchmarks 		-	Changes are made where necessary to ensure the goals of the business have been maintained				The control process: 		1.	Establish standards: In line with the firm’s goals and influence from employees, management, industry and government 		2.	Measure performance: Determine how comparisons will be made against standards or benchmarks 		3.	Take corrective action: Changing activities, processes and personnel to ensure that the goals of the business have been met 				Controlling methods 		1.	Quality control: Involves inspections, checking finished products and detecting and removing any components or ing  à many stages		•	One way communication: top to bottom 		•	Employee has no autonomy 		•	Planning, ideas: upper/middle management 		•	Strict responsibilities 	Flattened 		A flattened management structure is more flexible. There are less levels of management and decisions are made collaboratively with all workers. 				•	Level of control/responsibility/accountability is equal for all workers 		•	Decisions are made quickly à less stages of management 		•	Communication is faster 		•	Allows businesses to adapt quickly 		•	Recognises workers are an important asset for ideas 		Leadership style 			Autocratic à decisions made directly from management in terms of how and what to do. Important for inexperienced employees. 				Span of control (narrow) à employees are not trusted to carry out tasks independently, and are closely supervised.  				Chain of Command à long, rigid chain of command 				Centralized à decision making is centralized under higher levels of management 				Division of labour à specialized people for effective, efficient work. May lead to increased costs if people cannot fill in for other duties 			Democratic à The opinions of employees are valued and considered. They have a large say in the decisions which are made however final decision is still made by upper management. 				Span of control (wide) à Laissez-fairre - complete trust in employees to carry out tasks with little supervision 				Chain of Command à short, flexible chain of command 				Decentralized à decisions are made by teams rather than higher authorities 				Division of labour à Multi-skilled: people are trained in various areas and can fill in for other roles																				Contingency Approach 		-	Allows the business to adapt quickly to change by responding to the current business conditions in an appropriate way 		-	Either/or a combination of the classical and behavioural management approaches 		Advantages/Disadvantages of management approach 			Classical/scientific 	Behavioural/participative 	Contingency 		Advantages 	-	Allows for inexperienced workers to be closely supervised and mentored by someone of higher power 		-	There is a clear line of control and authority where workers always have someone to report too 		-	Ensures that the best decisions are made, as they must be considered by many people first 		-	Clear communication 		-	Increases output 			-	Workers feel valued in knowing their opinion matters and is considered à this leads to higher work productivity 		-	Allows for better interaction between workers in a collaborative matter, which encourages communication skills 		-	Encourages a creative environment where workers can openly share individual ideas, which are then adapted to suit certain situation		-	Improved relationship between employees and staff 	-	Allows managers to change the policies according to the situation 		-	Helps the manager enhance their leadership and decision making skills 		-	Provides options to the employees, helps them to grow and share their ideas to the business 		-	Recognises different situations demand different approaches 		-	Acknowledges there is no one best way 				Disadvantages 	-	Some workers may feel underappreciated as they do not have a large say in decisions 		-	Decision making takes a long time as it must go through many stages 		-	Low worker satisfaction 		-	Hard to respond to changes in environment 		-	Inflexibility 		-	May discourage innovation and creativity 		-	Specialized division of labour may lead to increase costs if already employed people cannot fill in for other duties 	-	It may lead to procrastination where individuals do not work efficiently as they believe someone else on the team will do it 		-	It does not guarantee the best possible solution is made, as decisions are decided upon by groups rather than a higher authority 		-	It may take time to reach a consensus where the best interests and opinions of everyone are considered 	-	Adapting to constant changes in the business environ
